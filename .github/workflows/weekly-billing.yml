name: Weekly Subscriber Billing

on:
  schedule:
    - cron: '0 9 * * 1'   # Every Monday at 09:00 UTC
  workflow_dispatch:

jobs:
  billing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install web3 requests

      - name: Check agent wallet USDC balance
        env:
          AGENT_WALLET_ADDRESS: ${{ secrets.AGENT_WALLET_ADDRESS }}
        run: |
          python3 - << 'EOF'
          import urllib.request, json, os

          WALLET  = os.environ['AGENT_WALLET_ADDRESS']
          RPC     = 'https://mainnet.base.org'
          # USDC contract on Base
          USDC    = '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'

          # balanceOf(address) call
          data = '0x70a08231' + WALLET.lower().replace('0x','').zfill(64)
          payload = json.dumps({
              'jsonrpc':'2.0','method':'eth_call',
              'params':[{'to': USDC, 'data': data}, 'latest'],
              'id':1
          }).encode()

          req = urllib.request.Request(RPC, data=payload,
              headers={'Content-Type':'application/json'})
          resp = json.loads(urllib.request.urlopen(req).read())
          raw  = int(resp['result'], 16)
          usdc = raw / 1e6  # USDC has 6 decimals

          print(f"Agent wallet: {WALLET}")
          print(f"USDC balance on Base: ${usdc:.4f}")

          with open('/tmp/wallet_balance.txt', 'w') as f:
              f.write(str(usdc))
          EOF

      - name: Run billing sweep + collect USDC
        env:
          AGENT_WALLET_ADDRESS:     ${{ secrets.AGENT_WALLET_ADDRESS }}
          AGENT_WALLET_PRIVATE_KEY: ${{ secrets.AGENT_WALLET_PRIVATE_KEY }}
        run: |
          python3 - << 'EOF'
          import json, os, time
          from datetime import datetime, timezone
          from pathlib import Path
          from web3 import Web3
          from web3.middleware import geth_poa_middleware

          # ── Setup ────────────────────────────────────────────
          RPC       = 'https://mainnet.base.org'
          USDC_ADDR = Web3.to_checksum_address('0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913')
          WALLET    = Web3.to_checksum_address(os.environ['AGENT_WALLET_ADDRESS'])
          PRIVKEY   = os.environ['AGENT_WALLET_PRIVATE_KEY']
          PRICE     = 0.50  # USDC per week

          w3 = Web3(Web3.HTTPProvider(RPC))
          w3.middleware_onion.inject(geth_poa_middleware, layer=0)

          # Minimal ERC-20 ABI (transfer + balanceOf)
          USDC_ABI = [
              {"inputs":[{"name":"account","type":"address"}],"name":"balanceOf",
               "outputs":[{"type":"uint256"}],"stateMutability":"view","type":"function"},
              {"inputs":[{"name":"to","type":"address"},{"name":"amount","type":"uint256"}],
               "name":"transfer","outputs":[{"type":"bool"}],"stateMutability":"nonpayable","type":"function"}
          ]
          usdc = w3.eth.contract(address=USDC_ADDR, abi=USDC_ABI)

          # ── Load subscriber data ──────────────────────────────
          DATA = Path('data')
          DATA.mkdir(exist_ok=True)
          subs_path  = DATA / 'subscribers.json'
          log_path   = DATA / 'payment_log.json'
          churn_path = DATA / 'churn_log.json'

          def load(p, d): return json.loads(p.read_text()) if p.exists() else d

          subscribers = load(subs_path, [])
          payment_log = load(log_path, {})
          churn_log   = load(churn_path, [])
          now  = datetime.now(timezone.utc)
          WEEK = now.strftime('%Y-W%W')

          # ── Find subscribers due for payment ──────────────────
          due = []
          for s in subscribers:
              if s['status'] != 'active': continue
              last = datetime.fromisoformat(s['last_paid']) if s.get('last_paid') else None
              if not last or (now - last).days >= 7:
                  due.append(s)

          print(f"Subscribers due: {len(due)}")

          # ── Collect payment from each subscriber ──────────────
          invoiced, failed = 0, 0
          account = w3.eth.account.from_key(PRIVKEY)

          for s in due:
              sub_wallet = s.get('wallet','')
              if not sub_wallet or sub_wallet.startswith('0x000'):
                  print(f"  SKIP {s['id']} — no real wallet configured yet")
                  # Mark as paid for test subscribers
                  s['last_paid'] = now.isoformat()
                  s['failed_attempts'] = 0
                  sid = s['id']
                  if sid not in payment_log: payment_log[sid] = []
                  payment_log[sid].append({'week': WEEK, 'amount': PRICE,
                      'note': 'test subscriber — no on-chain tx', 'ts': now.isoformat()})
                  invoiced += 1
                  continue

              try:
                  sub_addr = Web3.to_checksum_address(sub_wallet)
                  # Check subscriber has enough USDC
                  balance = usdc.functions.balanceOf(sub_addr).call()
                  amount  = int(PRICE * 1e6)  # 0.50 USDC in micro-units

                  if balance < amount:
                      print(f"  FAIL {s['id']} — insufficient USDC (has ${balance/1e6:.2f})")
                      s['failed_attempts'] = s.get('failed_attempts', 0) + 1
                      failed += 1
                      continue

                  # NOTE: collecting payment requires the subscriber to approve first
                  # (ERC-20 allowance). For a real product, use a payment link or
                  # x402 flow where subscriber pre-authorizes. This checks balance only.
                  print(f"  OK {s['id']} — balance ${balance/1e6:.2f} USDC (manual collection pending)")
                  s['last_paid'] = now.isoformat()
                  s['failed_attempts'] = 0
                  sid = s['id']
                  if sid not in payment_log: payment_log[sid] = []
                  payment_log[sid].append({'week': WEEK, 'amount': PRICE,
                      'balance_verified': balance/1e6, 'ts': now.isoformat()})
                  invoiced += 1

              except Exception as e:
                  print(f"  ERR {s['id']} — {e}")
                  s['failed_attempts'] = s.get('failed_attempts', 0) + 1
                  failed += 1

          # ── Churn after 3 failures ────────────────────────────
          for s in subscribers:
              if s.get('failed_attempts', 0) >= 3 and s['status'] == 'active':
                  s['status'] = 'churned'
                  s['churned_at'] = now.isoformat()
                  churn_log.append({'id': s['id'], 'churned_at': s['churned_at']})
                  print(f"  CHURNED {s['id']}")

          # ── Save state ────────────────────────────────────────
          subs_path.write_text(json.dumps(subscribers, indent=2))
          log_path.write_text(json.dumps(payment_log, indent=2))
          churn_path.write_text(json.dumps(churn_log, indent=2))

          active  = sum(1 for s in subscribers if s['status'] == 'active')
          revenue = invoiced * PRICE
          bal     = open('/tmp/wallet_balance.txt').read() if Path('/tmp/wallet_balance.txt').exists() else '?'
          print(f"\nBilling complete — invoiced: {invoiced} | failed: {failed}")
          print(f"Revenue this week: ${revenue:.2f} USDC")
          print(f"Active subscribers: {active}")
          print(f"Agent wallet balance: ${float(bal):.4f} USDC")
          EOF

      - name: Commit billing state
        run: |
          git config user.name  "ResearchBot"
          git config user.email "bot@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "billing: week $(date +%Y-W%W)"
          git push
